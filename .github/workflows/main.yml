name: CI and Docker Publish

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # golangci-lint runs `go build` under the hood. The embed directive in
      # internal/api needs *some* dist folder to exist; rather than wire up
      # the npm pipeline here, stub the directory so static analysis can
      # type-check the code without producing the real frontend bundle.
      - name: Stub embed assets so lint can compile
        run: |
          mkdir -p backend/internal/api/dist/assets
          touch backend/internal/api/dist/index.html
          touch backend/internal/api/dist/assets/.gitkeep

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.0.0
        with:
          version: v2.11
          working-directory: backend

  backend-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies for go:embed
        working-directory: frontend
        run: npm ci

      - name: Build frontend assets for backend tests
        working-directory: frontend
        run: npm run build

      - name: Sync frontend dist into backend embed directory
        run: |
          rm -rf backend/internal/api/dist
          mkdir -p backend/internal/api/dist
          cp -R frontend/dist/. backend/internal/api/dist/

      - name: Run backend tests
        working-directory: backend
        run: go test -coverprofile=coverage.out ./...

      - name: Report backend coverage
        working-directory: backend
        run: |
          go tool cover -func=coverage.out
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          awk -v total="$total" 'BEGIN { if (total < 30) { printf "coverage %.1f%% is below 30%% baseline\n", total; exit 1 } }'

      - name: Upload backend coverage
        uses: actions/upload-artifact@v6.0.0
        with:
          name: backend-coverage
          path: backend/coverage.out

  frontend-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Audit frontend dependency tree
        run: npm audit --audit-level=moderate

      - name: Run frontend production build
        run: npm run build

  security-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Prepare embedded assets for package loading
        run: |
          mkdir -p backend/internal/api/dist/assets
          touch backend/internal/api/dist/index.html
          touch backend/internal/api/dist/assets/.gitkeep

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.2.0

      - name: Scan reachable Go vulnerabilities
        working-directory: backend
        run: govulncheck ./...

  ipv6-protocol-e2e:
    # A real local data path: compatible client -> IPv6 loopback -> Xray VLESS
    # or sing-box Hysteria2 -> IPv6 loopback HTTP origin. It needs no VPS or
    # Internet egress after these pinned binaries are downloaded.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go for local Reality target
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Download pinned protocol engines
        run: |
          mkdir -p /tmp/zenith-ipv6-e2e
          curl -fsSL -o /tmp/zenith-ipv6-e2e/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-linux-64.zip
          echo '0eec3ed4163c273d8c8bf821f7d219e257921cf584aa3fb970715e458e631978  /tmp/zenith-ipv6-e2e/xray.zip' | sha256sum -c -
          unzip -q /tmp/zenith-ipv6-e2e/xray.zip xray -d /tmp/zenith-ipv6-e2e
          chmod 755 /tmp/zenith-ipv6-e2e/xray
          curl -fsSL -o /tmp/zenith-ipv6-e2e/sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz
          echo '699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968  /tmp/zenith-ipv6-e2e/sing-box.tar.gz' | sha256sum -c -
          tar -xzf /tmp/zenith-ipv6-e2e/sing-box.tar.gz -C /tmp/zenith-ipv6-e2e
          cp /tmp/zenith-ipv6-e2e/sing-box-1.14.4-linux-amd64/sing-box /tmp/zenith-ipv6-e2e/sing-box
          chmod 755 /tmp/zenith-ipv6-e2e/sing-box

      - name: Exercise IPv6 VLESS and Hysteria2 data paths
        run: XRAY_BIN=/tmp/zenith-ipv6-e2e/xray SINGBOX_BIN=/tmp/zenith-ipv6-e2e/sing-box bash scripts/test_ipv6_protocol_e2e.sh

  docker-smoke:
    # End-to-end smoke of the published Docker image: build locally with the
    # same Dockerfile as the publish job, start the container, wait for the
    # health endpoint to flip to 200, then exercise zenithctl via docker
    # exec. Catches regressions where the image builds but the panel can't
    # actually boot inside Alpine (missing libc, broken paths, etc.) before
    # we ship it to ghcr.io.
    runs-on: ubuntu-latest
    needs:
      - backend-verify
      - frontend-verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build image locally (no push)
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          load: true
          tags: zenithpanel:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d \
            --name zsmoke \
            -p 18080:8080 \
            -e ZENITH_PORT=8080 \
            zenithpanel:smoke
          # Tiny startup grace; the polling loop covers slow boots.
          sleep 2

      - name: Verify external runner preserves VLESS and Hysteria2 streams
        # This creates uniquely named, host-networked test containers and a
        # temporary volume, then cleans them with a trap. It replaces only a
        # panel test container; it never pulls or updates a published image.
        run: bash scripts/test_external_proxy_runner.sh zenithpanel:smoke

      - name: Wait for /api/v1/health → 200
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/api/v1/health > /tmp/health.json; then
              echo "Panel responded after ${i}s:"
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "::error::Panel never returned 200 on /health"
          docker logs zsmoke | tail -50
          exit 1

      - name: Exercise zenithctl inside the container
        run: |
          docker exec zsmoke /opt/zenithpanel/zenithpanel ctl version
          docker exec zsmoke /opt/zenithpanel/zenithpanel ctl status

      - name: Generate final-image SBOM
        uses: anchore/sbom-action@v0.22.2
        with:
          image: zenithpanel:smoke
          format: spdx-json
          output-file: zenithpanel-sbom.spdx.json

      - name: Scan final image for fixable high/critical vulnerabilities
        # Full immutable SHA for the safe v0.35.0 release. Most older mutable
        # Trivy action tags were compromised in March 2026 (GHSA-69fq-xp46-6x23).
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: zenithpanel:smoke
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Dump tail of panel logs (for the record)
        if: always()
        run: docker logs zsmoke 2>&1 | tail -40

      - name: Tear down
        if: always()
        run: docker rm -f zsmoke || true

  build-and-push-image:
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-verify
      - frontend-verify
      - security-verify
      - ipv6-protocol-e2e
      - docker-smoke
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0 # full history + tags so `git describe` can name builds

      # Install the cosign tool except on PR
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.4'

      # QEMU is only needed for the arm64 runtime stage (apk/unzip); the
      # frontend and Go stages cross-compile natively on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Override default tag list so :latest tracks the default branch.
          # Without this, latest only updates on git tag pushes (v*.*.*), which
          # left users on :latest pulling stale images between releases.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr,prefix=pr-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Compute build version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(git describe --tags --always --dirty 2>/dev/null || echo "${{ github.ref_name }}-${GITHUB_SHA::7}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ steps.ver.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the published Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
