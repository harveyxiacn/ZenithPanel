name: Scheduled Security and Race Checks

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-race-and-vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Stub embedded frontend for Go compilation
        run: |
          mkdir -p backend/internal/api/dist/assets
          touch backend/internal/api/dist/index.html
          touch backend/internal/api/dist/assets/.gitkeep
      - name: Race detector
        working-directory: backend
        run: go test -race ./...
      - name: Reachable vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.2.0
          cd backend
          govulncheck ./...

  node-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run build
